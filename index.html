<!DOCTYPE html>
<html lang="nl">
    <head>
        <script src="./src/index.js" type="module" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
        <link rel="stylesheet" href="./styles/index.css"/>
        <link rel="icon" href="public/images/duck.png" />
        <title>
            Room
        </title>
    </head>
    <body>
        <section class="pokemon-toggle">
            <input id="pokemon-theme" type="checkbox" />
            <label class="pokemon-label" for="pokemon-theme">Pokémon Modus</label>
        </section>
        <section class="intro">
            <section class="header-text">
                <h1> Over Romy </h1>
                <h2>Pak een kaart!</h2>
            </section>

            <section class="cards">

                <!--Het gebruik van card-front en card-back divs geïnspireerd door ChatGPT-->
            
                <button class="card">
                    <div class="card-inner">
                        <div class="card-back">
                            <video autoplay loop muted> 
                                <source alt="Hond die speelt met filmend baasje met een kerstboom knuffel" src="public/videos/Liz.mp4" type="video/mp4" />
                            </video>
                        </div>

                        <div class="card-front">
                            <section>
                                <p>
                                    Ik vind Harry Potter erg leuk, maar ik heb nog steeds niet alle 7 Harry Potter-boeken gelezen..
                                </p>
                                <img alt="Bliksemschicht" src="public/icons/bolt.svg" />
                            </section>
                        </div>
                    </div>
                </button>

                <button class="card">
                    <div class="card-inner">
                        <div class="card-back">
                            <img src="public/images/romy-haai.jpeg" alt="Romy met een haai op haar hoofd" />
                        </div>

                        <div class="card-front">
                            <section>
                                <p>
                                    Ik vind bordspelletjes super leuk! Mijn favoriete bordspel heet 'Keezen', dit lijkt erg op mens-erger-je-niet.
                                </p>
                                <img alt="Schoppen" src="public/icons/spade.svg" />
                            </section>
                        </div>
                    </div>
                </button>

                <button class="card">
                    <div class="card-inner">
                        <div class="card-back">
                            <img src="public/images/Romy.jpeg" alt="Romy zittend op de stoel van de kapitein in de navigatiebrug van de Britannica van StenaLine" />
                        </div>

                        <div class="card-front">
                            <section>
                               <dl class="romy-info">
                                    <dt>Bijnaam</dt>
                                    <dd id="nickname"></dd>
                                    
                                    <dt>Naam</dt>
                                    <dd id="name"></dd>

                                    <dt>Leeftijd</dt>
                                    <dd id="age"></dd>

                                    <dt>Woonplaats</dt>
                                    <dd id="city"></dd>

                                    <dt>Favoriete pokémon</dt>
                                    <dd id="pokemon"></dd>
                               </dl>
                                <p id="emoji"></p>
                            </section>
                        </div>
                    </div>
                </button>
            </section>
        </section>
        <section class="memory">
            <section class="header-text">
                <h2 class="memory-title"> Memory </h2>
                <h3 class="score">Score: 0</h3>
                <button class="reset-button">
                    Reset
                </button>
            </section>

            <section class="memory-field">
                <!-- Hier worden de velden dynamisch aangemaakt -->
            </section>
        </section>
        <section class="ducks-container">
            <!-- svg gegenereerd door chatgpt -->
            <div class="wave-wrapper">
                <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220">
                    <path fill="#0099ff" fill-opacity="1"
                        d="M0,160
                        C120,200 240,120 360,160
                        C480,200 600,120 720,160
                        C840,200 960,120 1080,160
                        C1200,200 1320,120 1440,160
                        L1440,320 L0,320 Z"/>
                </svg>
                <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220">
                    <path fill="#0099ff" fill-opacity="1"
                        d="M0,160
                        C120,200 240,120 360,160
                        C480,200 600,120 720,160
                        C840,200 960,120 1080,160
                        C1200,200 1320,120 1440,160
                        L1440,320 L0,320 Z"/>
                </svg>
                <img class="mother-duck" src="public/images/duck.png" alt="Moeder eend" />
                <img class="duckling" src="public/images/duck.png" alt="Kind eend" />              
                <img class="duckling" src="public/images/duck.png" alt="Kind eend" />              
            </div>
            <div class="wave-wrapper">
                <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220">
                    <path fill="#0066ff" fill-opacity="1"
                        d="M0,180
                        C120,220 240,140 360,180
                        C480,220 600,140 720,180
                        C840,220 960,140 1080,180
                        C1200,220 1320,140 1440,180
                        L1440,320 L0,320 Z"/>
                </svg>
                <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220">
                    <path fill="#0066ff" fill-opacity="1"
                        d="M0,180
                        C120,220 240,140 360,180
                        C480,220 600,140 720,180
                        C840,220 960,140 1080,180
                        C1200,220 1320,140 1440,180
                        L1440,320 L0,320 Z"/>
                </svg>
            </div>
        </section>
        <audio id="card-flip" src="public/sounds/freesound_community-flipcard-91468.mp3"></audio>
        <audio id="kids-cheering" src="public/sounds/kids_cheering.mp3"></audio>
    </body>
</html>
